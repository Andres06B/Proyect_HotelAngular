<div class="background-container">
  <div class="login-container">
    <form (ngSubmit)="onSubmit()" class="login-form">
      <h2 class="text-center mb-4">
        New Iguanas's House
      </h2>
      
      <!-- Icon image below the heading -->
      <div class="text-center mb-4">
        <img src="Imagen1.png" alt="Icono" class="login-icon">
      </div>

      <div class="form-group mb-3">
        <h2 class="text-center mb-4">Iniciar Sesión</h2>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input type="email" class="form-control" [(ngModel)]="email" name="email" placeholder="Correo electrónico" required>
        </div>
      </div>
      <div class="form-group mb-3">
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input [type]="showPassword ? 'text' : 'password'" class="form-control" [(ngModel)]="password" name="password" placeholder="Contraseña" required>
          <button class="btn btn-outline-secondary" type="button" (click)="togglePasswordVisibility()">
            <i [class]="showPassword ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
          </button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-100 mb-3" routerLink="/main">Iniciar Sesión</button>
      <div class="form-footer text-center">
        <a href="#" class="text-muted">¿Olvidaste tu contraseña?</a>
      </div>
    </form>
  </div>
</div>
